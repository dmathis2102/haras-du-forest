<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haras du Forest — Espace Moniteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #152240;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
  }

  .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    color: #0E1C35;
    margin-bottom: 4px;
  }
  .brand-sub {
    font-size: 11px;
    color: #8A96A8;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .divider {
    width: 40px; height: 2px;
    background: #C4A97E;
    margin: 12px auto 28px;
    border-radius: 2px;
  }

  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #152240, #2A5298);
    color: #C4A97E;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .role-badge {
    display: inline-block;
    background: #EEF2FB;
    color: #152240;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .monitor-name {
    font-size: 22px;
    font-weight: 700;
    color: #0E1C35;
    margin-bottom: 6px;
  }
  .monitor-email {
    font-size: 13px;
    color: #8A96A8;
    margin-bottom: 32px;
  }

  .coming-soon {
    background: #F8F5F0;
    border: 1px solid #E8DFC8;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
  }
  .coming-soon-icon {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .coming-soon-title {
    font-size: 15px;
    font-weight: 700;
    color: #0E1C35;
    margin-bottom: 6px;
  }
  .coming-soon-desc {
    font-size: 13px;
    color: #4A5568;
    line-height: 1.6;
  }

  .btn-logout {
    width: 100%;
    padding: 13px;
    background: #152240;
    color: #C4A97E;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.3px;
    transition: background 0.15s;
  }
  .btn-logout:hover { background: #1E3260; }

  /* Loader */
  #loader {
    position: fixed; inset: 0;
    background: #152240;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    z-index: 999;
  }
  .loader-brand {
    font-family: 'Playfair Display', Georgia, serif;
    color: #C4A97E;
    font-size: 20px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(196,169,126,0.25);
    border-top-color: #C4A97E;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-brand">Haras du Forest</div>
  <div class="spinner"></div>
</div>

<!-- Carte principale -->
<div class="card" id="main-card" style="display:none">
  <div class="brand">Haras du Forest</div>
  <div class="brand-sub">Bondues · Nord</div>
  <div class="divider"></div>

  <div class="avatar" id="monitor-avatar">?</div>
  <div class="role-badge">Moniteur</div>
  <div class="monitor-name" id="monitor-name">—</div>
  <div class="monitor-email" id="monitor-email">—</div>

  <div class="coming-soon">
    <div class="coming-soon-icon">🐴</div>
    <div class="coming-soon-title">Interface en cours de création</div>
    <div class="coming-soon-desc">
      Ton espace de gestion des cours et des cavaliers<br>
      sera disponible très prochainement.
    </div>
  </div>

  <button class="btn-logout" onclick="doLogout()">Se déconnecter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyAwspb2AUT9JvV4x3hn362ttKtHmfEc6Fc",
    authDomain:        "haras-du-forest.firebaseapp.com",
    projectId:         "haras-du-forest",
    storageBucket:     "haras-du-forest.firebasestorage.app",
    messagingSenderId: "661096788450",
    appId:             "1:661096788450:web:49783a922deb41fa01c9bb"
  });
  const auth = firebase.auth();
  const db   = firebase.firestore();

  auth.onAuthStateChanged(async user => {
    const loader = document.getElementById('loader');
    const card   = document.getElementById('main-card');

    if (!user) {
      window.location.href = '../Application/index.html';
      return;
    }

    try {
      const snap = await db.collection('users').doc(user.uid).get();
      const data = snap.exists ? snap.data() : {};
      const role = data.role || 'client';

      // Sécurité : seul un moniteur peut accéder à cette page
      if (role !== 'moniteur') {
        await auth.signOut();
        window.location.href = '../Application/index.html';
        return;
      }

      // Affiche les infos du moniteur
      const prenom = data.prenom || user.email.split('@')[0];
      const nom    = data.nom    || '';
      const nomComplet = nom ? `${prenom} ${nom}` : prenom;
      const initiales  = ((prenom[0] || '') + (nom[0] || '')).toUpperCase() || '?';

      document.getElementById('monitor-avatar').textContent = initiales;
      document.getElementById('monitor-name').textContent   = nomComplet;
      document.getElementById('monitor-email').textContent  = user.email;

    } catch(e) {
      console.warn('Erreur lecture profil moniteur :', e.message);
      document.getElementById('monitor-name').textContent  = user.email;
      document.getElementById('monitor-email').textContent = '';
    }

    loader.style.display = 'none';
    card.style.display   = '';
  });

  function doLogout() {
    auth.signOut().then(() => window.location.href = '../Application/index.html');
  }
</script>
</body>
</html>
